.zig{height:12px;background:
  linear-gradient(135deg,var(--brown) 25%,transparent 25%) -6px 0/12px 12px,
  linear-gradient(225deg,var(--brown) 25%,transparent 25%) -6px 0/12px 12px;
  background-color:var(--cream);margin-top:-1px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.brand{text-align:center;padding:26px 0 8px}
.brand h1{margin:0;font-weight:400;display:flex;gap:14px;justify-content:center;align-items:baseline;flex-wrap:wrap}
.script{font-family:var(--script);font-size:clamp(2.6rem,7vw,3.8rem);line-height:1.1}
.cjk{font-weight:900;font-size:clamp(1.7rem,4.5vw,2.4rem);letter-spacing:.12em}
.rule{display:flex;align-items:center;max-width:760px;margin:14px auto 12px}
.rule i{width:11px;height:11px;border:2px solid var(--brown);border-radius:50%;flex:none;background:var(--cream)}
.rule hr{flex:1;border:0;border-top:2px solid var(--brown);margin:0}
.tag{margin:0;font-weight:900;letter-spacing:.42em;font-size:.85rem}

/* ribbons (headings + tabs) */
.ribbon,.tab{
  position:relative;display:inline-block;margin:0;border:0;cursor:pointer;
  background:var(--brown);color:var(--cream);font-weight:500;letter-spacing:.32em;
  padding:8px 40px 8px 44px;font-size:1rem;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);
}
.ribbon::before,.tab::before{content:"";position:absolute;inset:3px 12px;border-top:1px solid rgba(253,231,190,.55);border-bottom:1px solid rgba(253,231,190,.55);pointer-events:none}
h2.ribbon{cursor:default;margin-bottom:16px}
.tabs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px}
.tab{background:var(--cream-d);color:var(--brown);padding:11px 52px 11px 56px}
.tab::before{border-color:rgba(100,46,20,.35)}
.tab[aria-selected=true]{background:var(--brown);color:var(--cream)}
.tab[aria-selected=true]::before{border-color:rgba(253,231,190,.55)}
.tab:hover{background:var(--brown-l);color:var(--cream)}
.tab:focus-visible{text-decoration:underline;outline:none}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.stack{display:grid;gap:22px;min-width:0}
.card{background:var(--cream-l);border:2px solid var(--brown);padding:22px 22px 24px;
  box-shadow:inset 0 0 0 4px var(--cream-l),inset 0 0 0 5px rgba(100,46,20,.3)}
.sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fields .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font-weight:500;font-size:.92rem}
input,select,textarea{width:100%;background:#fffdf5;border:1.5px solid var(--brown);border-radius:3px;padding:8px 10px;min-height:42px}
textarea{resize:vertical;min-height:70px}
input[readonly],input:disabled{background:var(--cream);opacity:.8}
input[type=radio],input[type=checkbox]{width:auto;min-height:0;accent-color:var(--brown)}

.kind{display:flex;gap:0;margin-bottom:18px;border:2px solid var(--brown);width:max-content;max-width:100%}
.kind button{border:0;background:transparent;padding:8px 26px;cursor:pointer;font-weight:700;letter-spacing:.15em}
.kind button[aria-pressed=true]{background:var(--brown);color:var(--cream)}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.row>label.f{flex:1 1 150px}
fieldset{border:1.5px dashed rgba(100,46,20,.6);margin:0 0 14px;padding:10px 14px 12px}
legend{font-weight:700;padding:0 6px}
.opts{display:flex;gap:20px;flex-wrap:wrap}
.opts label,.chips label{display:flex;align-items:center;gap:6px;cursor:pointer}
.chips{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(100,46,20,.4)}
.chips[hidden]{display:none}
.split{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:8px}
.split label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
.split .u{display:flex;align-items:center;gap:6px}
.status{margin:6px 0 14px;font-weight:700;min-height:1.6em}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.hint{font-size:.85rem;opacity:.85;margin:0 0 12px}
.addrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pricing{font-weight:700}

.btn{background:var(--brown);color:var(--cream);border:2px solid var(--brown);padding:9px 22px;cursor:pointer;font-weight:700;letter-spacing:.12em;border-radius:3px}
.btn:hover{background:var(--brown-l);border-color:var(--brown-l)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brown)}
.btn.ghost:hover{background:var(--cream-d)}
.btn.sm{padding:4px 12px;font-size:.85rem;letter-spacing:.05em}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad);color:#fff}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 8px;border-bottom:1px solid rgba(100,46,20,.25);text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--brown);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td small{display:block;opacity:.8}
tfoot td{font-weight:900;border-bottom:0;font-size:1.05rem}
.empty{opacity:.8;margin:6px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mat h3{font-size:.95rem;margin:16px 0 6px;letter-spacing:.1em}
.mat h3:first-child{margin-top:0}
.mat .pill{display:inline-block;border:1.5px solid var(--brown);padding:1px 10px;margin:0 6px 6px 0;border-radius:99px;font-size:.88rem}
.mat td.need{font-weight:700}

.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.bar label.f{flex:1 1 150px}
.bar .grow{flex:2 1 220px}
.orders{display:grid;gap:14px}
.order{display:grid;grid-template-columns:auto 1fr auto;gap:14px;border:1.5px solid var(--brown);background:#fffdf5;padding:14px 16px}
.order.sel{background:var(--cream);outline:2px solid var(--brown)}
.order .pick{padding-top:4px}
.order input[type=checkbox]{width:20px;height:20px}
.o-head{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline}
.o-head strong{font-size:1.1rem}
.o-items{margin:8px 0 6px;padding-left:18px}
.o-note{font-size:.9rem;border-left:3px solid var(--cream-d);padding-left:10px;margin:6px 0}
.o-side{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.o-total{font-weight:900;font-size:1.3rem}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700}
details .mat{margin-top:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed rgba(100,46,20,.5)}
footer{text-align:center;font-size:.85rem;padding:0 20px 40px;opacity:.85}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brown);color:var(--cream);padding:10px 22px;border-radius:3px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
[hidden]{display:none!important}

@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .sticky{position:static;max-height:none}
}
@media (max-width:620px){
  .fields{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr 1fr}
  .order{grid-template-columns:auto 1fr}
  .o-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .card{padding:18px 14px 20px}
  .tab{padding:10px 40px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<body>
<div class="top" role="presentation"></div>
<div class="zig" role="presentation"></div>

<main class="wrap">
  <section class="brand">
    <h1><span class="script">Love Yourself</span><span class="cjk">手作烘焙</span></h1>
    <div class="rule" role="presentation"><i></i><hr><i></i></div>
    <p class="tag">CHERISH THE SWEET TIME</p>
  </section>

  <nav class="tabs" role="tablist" aria-label="功能">
    <button class="tab" role="tab" id="t-new" aria-selected="true" aria-controls="tab-new">新增訂單</button>
    <button class="tab" role="tab" id="t-list" aria-selected="false" aria-controls="tab-list">訂單紀錄 <span id="cnt"></span></button>
  </nav>

  <!-- ============ 新增訂單 ============ -->
  <section id="tab-new" role="tabpanel" aria-labelledby="t-new">
    <div class="grid">
      <div class="stack">
        <div class="card">
          <h2 class="ribbon" id="formTitle">訂單資料</h2>
          <div class="fields">
            <label class="f">訂購人<input id="fName" autocomplete="off"></label>
            <label class="f">電話<input id="fPhone" type="tel" inputmode="tel" autocomplete="off"></label>
            <label class="f">送出日期<input id="fDate" type="date"></label>
            <label class="f wide">備註<textarea id="fNote"></textarea></label>
          </div>
        </div>

        <div class="card">
          <h2 class="ribbon">加入品項</h2>
          <div class="kind" role="group" aria-label="品項類型">
            <button type="button" id="kBox" aria-pressed="true">禮盒</button>
            <button type="button" id="kPiece" aria-pressed="false">單顆</button>
            <button type="button" id="kSnow" aria-pressed="false">雪Q餅</button>
          </div>

          <div id="boxPanel">
            <div class="row">
              <label class="f">盒型
                <select id="boxSize">
                  <option value="12">大盒　12 顆</option>
                  <option value="8">中盒　8 顆</option>
                  <option value="4">小盒　4 顆</option>
                </select>
              </label>
              <label class="f">盒數<input id="boxQty" type="number" min="1" step="1" value="1"></label>
            </div>
            <fieldset>
              <legend>口味</legend>
              <div class="opts">
                <label><input type="radio" name="boxMode" value="four" checked>四大天王（四款平分）</label>
                <label><input type="radio" name="boxMode" value="custom">自選口味</label>
              </div>
              <div class="chips" id="chipRow" hidden></div>
            </fieldset>
            <p class="hint" id="splitHint" hidden>選好口味後會先平分；無法整除時，把剩下的顆數直接填在下面欄位。沒填的視為 0。</p>
            <div class="split" id="splitBox"></div>
            <p class="status" id="splitStatus" role="status"></p>
            <div class="addrow">
              <span class="pricing" id="boxPrice"></span>
              <button class="btn" type="button" id="addBox">加入品項</button>
            </div>
          </div>

          <div id="piecePanel" hidden>
            <div class="row">
              <label class="f">口味<select id="pieceFlavor"></select></label>
              <label class="f">顆數<input id="pieceQty" type="number" min="1" step="1" value="1"></label>
            </div>
            <div class="addrow">
              <span class="pricing" id="piecePrice"></span>
              <button class="btn" type="button" id="addPiece">加入品項</button>
            </div>
          </div>

          <div id="snowPanel" hidden>
            <div class="row">
              <label class="f">口味<select id="snowFlavor"></select></label>
              <label class="f">袋數<input id="snowQty" type="number" min="1" step="1" value="1"></label>
            </div>
            <div class="addrow">
              <span class="pricing" id="snowPrice"></span>
              <button class="btn" type="button" id="addSnow">加入品項</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 class="ribbon">本單品項</h2>
          <div class="tw" id="draftItems"></div>
          <div class="actions">
            <button class="btn" type="button" id="saveOrder">送出訂單</button>
            <button class="btn ghost" type="button" id="resetOrder">清空重填</button>
          </div>
        </div>
      </div>

      <aside class="card sticky" aria-label="本單所需材料">
        <h2 class="ribbon">本單所需材料</h2>
        <div class="mat" id="draftMat"></div>
      </aside>
    </div>
  </section>

  <!-- ============ 訂單紀錄 ============ -->
  <section id="tab-list" role="tabpanel" aria-labelledby="t-list" hidden>
    <div class="grid">
      <div class="stack">
        <div class="card">
          <h2 class="ribbon">訂單紀錄</h2>
          <div class="bar">
            <label class="f grow">搜尋（訂購人／電話／備註）<input id="q" type="search" autocomplete="off"></label>
            <label class="f">送出日期　從<input id="dFrom" type="date"></label>
            <label class="f">到<input id="dTo" type="date"></label>
          </div>
          <div class="bar">
            <button class="btn ghost sm" type="button" id="selAll">全選目前列表</button>
            <button class="btn ghost sm" type="button" id="selNone">清除選取</button>
            <button class="btn ghost sm" type="button" id="fClear">清除篩選</button>
          </div>
          <div class="orders" id="orders"></div>
          <div class="tools">
            <button class="btn ghost sm" type="button" id="expJson">匯出備份 (JSON)</button>
            <button class="btn ghost sm" type="button" id="impJson">匯入備份</button>
            <button class="btn ghost sm" type="button" id="expCsv">匯出 CSV</button>
            <input type="file" id="impFile" accept="application/json,.json" hidden>
          </div>
        </div>
      </div>
      <aside class="card sticky" aria-label="選取訂單的材料總計">
        <h2 class="ribbon">選取訂單備料</h2>
        <p class="empty" id="selInfo"></p>
        <div class="mat" id="selMat"></div>
      </aside>
    </div>
  </section>
</main>

<footer>訂單資料只存在這台裝置的瀏覽器裡，不會上傳，也不在網頁原始碼中。換裝置或清除瀏覽資料前，請先匯出備份。</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= 設定：價格、材料、配方（可自行修改） ================= */
const PRICE_BOX_PIECE = 50;   // 禮盒每顆
const PRICE_SNOW_BAG  = 120;  // 雪Q餅每袋
const BAGS_PER_TRAY   = 4;    // 一盤 = 同口味 4 袋

// pack = 每包裝克數；pu = 包裝單位；count = 直接以「顆」計算
const MATERIALS = {
  mid:      {name:'中筋麵粉', pack:3000, pu:'袋'},
  low:      {name:'低筋麵粉', pack:3000, pu:'袋'},
  sugar:    {name:'糖粉',     pack:600,  pu:'袋'},
  shorten:  {name:'酥油',     pack:1000, pu:'桶'},
  redBean:  {name:'紅豆沙',   pack:600,  pu:'袋'},
  taroFill: {name:'芋頭餡',   pack:600,  pu:'袋'},
  mungFill: {name:'綠豆餡',   pack:600,  pu:'袋'},
  purple:   {name:'紫薯粉',   pack:100,  pu:'袋'},
  yolk:     {name:'蛋黃',     count:true, pu:'顆'},
  egg:      {name:'全蛋',     pack:50,   pu:'顆'},
  butter:   {name:'奶油',     pack:454,  pu:'條'},
  milk:     {name:'奶粉',     pack:1000, pu:'袋'},
  marsh:    {name:'棉花糖',   pack:1000, pu:'袋'},
  qifu:     {name:'奇福餅',   pack:600,  pu:'袋'},
  cran:     {name:'蔓越莓',   pack:600,  pu:'袋'},
  cocoa:    {name:'可可粉',   pack:300,  pu:'袋'},
  matcha:   {name:'抹茶粉'},
  sesame:   {name:'芝麻粉'}
};

// 酥類：每顆用量
const FLAVORS = [
  {k:'yolk', name:'蛋黃酥',     m:{mid:3.5, low:12.5, shorten:7.1, sugar:1.3, redBean:25, yolk:1}},
  {k:'taro', name:'芋頭酥',     m:{mid:6, low:11, shorten:7.5, sugar:1, purple:0.7, taroFill:25, yolk:1}}, // ⚠ 芋頭餡 25g 為暫定值，請確認
  {k:'pine', name:'菠蘿蛋黃酥', m:{low:14.7, shorten:7.1, sugar:4, redBean:25, yolk:1, egg:3.4, milk:0.7}},
  {k:'mung', name:'綠豆椪',     m:{mid:3.5, low:12.5, shorten:7.1, sugar:1.3, mungFill:25, yolk:1}}
];
// 雪Q餅：每袋用量
const SNOW = [
  {k:'plain',  name:'原味雪Q餅',   m:{butter:15, marsh:62.5, milk:12.5,  qifu:75, cran:25}},
  {k:'choco',  name:'巧克力雪Q餅', m:{butter:15, marsh:62.5, milk:10,    qifu:75, cran:25, cocoa:5}},
  {k:'matcha', name:'抹茶雪Q餅',   m:{butter:15, marsh:62.5, milk:10,    qifu:75, cran:25, matcha:3.75}},
  {k:'sesame', name:'芝麻雪Q餅',   m:{butter:15, marsh:62.5, milk:8.75,  qifu:75, cran:25, sesame:4}}
];
const BOX_NAMES = {12:'大盒', 8:'中盒', 4:'小盒'};

/* ================= 工具 ================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const fmt = n=>(Math.round(n*100)/100).toLocaleString('zh-TW');
const money = n=>'$'+Math.round(n).toLocaleString('zh-TW');
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = ()=>new Date().toLocaleDateString('sv');
const ceil = x=>Math.ceil(x-1e-9);
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= 資料（只存在瀏覽器 localStorage） ================= */
const KEY='llb_orders_v1';
function loadOrders(){try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a.map(normOrder).filter(Boolean):[]}catch{return[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch{toast('無法寫入瀏覽器儲存空間，請立即匯出備份')}}
function normItem(it){
  if(!it||typeof it!=='object')return null;
  const qty=Math.max(0,Math.floor(num(it.qty))), unit=num(it.unit);
  if(it.type==='box'){
    const size=[4,8,12].includes(+it.size)?+it.size:12, split={};
    FLAVORS.forEach(f=>split[f.k]=Math.max(0,Math.floor(num(it.split?.[f.k]))));
    return {type:'box',size,mode:it.mode==='four'?'four':'custom',split,qty,unit};
  }
  if(it.type==='piece'&&FLAVORS.some(f=>f.k===it.flavor))return {type:'piece',flavor:it.flavor,qty,unit};
  if(it.type==='snow'&&SNOW.some(s=>s.k===it.flavor))return {type:'snow',flavor:it.flavor,qty,unit};
  return null;
}
function normOrder(o){
  if(!o||typeof o!=='object')return null;
  const items=(Array.isArray(o.items)?o.items:[]).map(normItem).filter(Boolean);
  return {id:String(o.id||uid()),name:String(o.name||''),phone:String(o.phone||''),date:String(o.date||''),note:String(o.note||''),items,createdAt:num(o.createdAt)||Date.now()};
}
let orders=loadOrders();
let draft=[];          // 目前正在編輯的品項
let editingId=null;
let selected=new Set();

/* ================= 品項 / 計算 ================= */
const itemTotal=it=>it.qty*it.unit;
const unitOf=it=>it.type==='box'?'盒':it.type==='piece'?'顆':'袋';
const orderTotal=o=>o.items.reduce((s,i)=>s+itemTotal(i),0);
function itemName(it){
  if(it.type==='piece')return FLAVORS.find(f=>f.k===it.flavor).name+'（單顆）';
  if(it.type==='snow')return SNOW.find(s=>s.k===it.flavor).name;
  return `${BOX_NAMES[it.size]}（${it.size}顆）${it.mode==='four'?'四大天王':'自選口味'}`;
}
function itemDetail(it){
  if(it.type!=='box')return '';
  return FLAVORS.filter(f=>it.split[f.k]>0).map(f=>`${f.name} ${it.split[f.k]}`).join('、')+'（每盒）';
}
function calc(items){
  const mat={},pastry={},snow={};
  const add=(k,g)=>mat[k]=(mat[k]||0)+g;
  for(const it of items){
    if(it.type==='box'){
      for(const f of FLAVORS){
        const n=(it.split[f.k]||0)*it.qty; if(!n)continue;
        pastry[f.k]=(pastry[f.k]||0)+n;
        for(const [m,g] of Object.entries(f.m))add(m,g*n);
      }
    }else if(it.type==='piece'){
      const f=FLAVORS.find(x=>x.k===it.flavor);
      pastry[f.k]=(pastry[f.k]||0)+it.qty;
      for(const [m,g] of Object.entries(f.m))add(m,g*it.qty);
    }else{
      const s=SNOW.find(x=>x.k===it.flavor);
      snow[s.k]=(snow[s.k]||0)+it.qty;
      for(const [m,g] of Object.entries(s.m))add(m,g*it.qty);
    }
  }
  return {mat,pastry,snow};
}
function matHTML(items){
  const {mat,pastry,snow}=calc(items);
  const keys=Object.keys(MATERIALS).filter(k=>mat[k]>0);
  if(!keys.length)return '<p class="empty">加入品項後，這裡會自動列出所需材料。</p>';
  let h='';
  const pTotal=Object.values(pastry).reduce((a,b)=>a+b,0);
  if(pTotal){
    h+='<h3>酥類顆數</h3><div>'+FLAVORS.filter(f=>pastry[f.k]).map(f=>`<span class="pill">${f.name} ${fmt(pastry[f.k])} 顆</span>`).join('')+`<span class="pill">合計 ${fmt(pTotal)} 顆</span></div>`;
  }
  const sTotal=Object.values(snow).reduce((a,b)=>a+b,0);
  if(sTotal){
    h+='<h3>雪Q餅（'+BAGS_PER_TRAY+' 袋 = 1 盤）</h3><div class="tw"><table><thead><tr><th>口味</th><th class="n">袋數</th><th class="n">盤數</th></tr></thead><tbody>'
      +SNOW.filter(s=>snow[s.k]).map(s=>`<tr><td>${s.name}</td><td class="n">${fmt(snow[s.k])}</td><td class="n">${fmt(snow[s.k]/BAGS_PER_TRAY)}</td></tr>`).join('')
      +`</tbody><tfoot><tr><td>合計</td><td class="n">${fmt(sTotal)}</td><td class="n">${fmt(sTotal/BAGS_PER_TRAY)}</td></tr></tfoot></table></div>`;
  }
  h+='<h3>材料</h3><div class="tw"><table><thead><tr><th>材料</th><th class="n">用量</th><th class="n">約等於</th><th class="n">需備</th></tr></thead><tbody>';
  for(const k of keys){
    const m=MATERIALS[k],v=mat[k];
    if(m.count){
      h+=`<tr><td>${m.name}</td><td class="n">${fmt(v)} ${m.pu}</td><td class="n">—</td><td class="n need">${fmt(ceil(v))} ${m.pu}</td></tr>`;
    }else if(m.pack){
      const p=v/m.pack;
      h+=`<tr><td>${m.name}<small>${fmt(m.pack)} g／${m.pu}</small></td><td class="n">${fmt(v)} g</td><td class="n">${fmt(p)} ${m.pu}</td><td class="n need">${fmt(ceil(p))} ${m.pu}</td></tr>`;
    }else{
      h+=`<tr><td>${m.name}</td><td class="n">${fmt(v)} g</td><td class="n">—</td><td class="n">—</td></tr>`;
    }
  }
  return h+'</tbody></table></div>';
}

/* ================= 分頁 ================= */
function showTab(name){
  const isNew=name==='new';
  $('#t-new').setAttribute('aria-selected',isNew);
  $('#t-list').setAttribute('aria-selected',!isNew);
  $('#tab-new').hidden=!isNew; $('#tab-list').hidden=isNew;
  if(!isNew)renderList();
  window.scrollTo({top:0});
}
$('#t-new').onclick=()=>showTab('new');
$('#t-list').onclick=()=>showTab('list');

/* ================= 新增訂單：品項建立器 ================= */
function initBuilder(){
  $('#chipRow').innerHTML=FLAVORS.map(f=>`<label><input type="checkbox" value="${f.k}">${f.name}</label>`).join('');
  $('#splitBox').innerHTML=FLAVORS.map(f=>`<label>${f.name}<span class="u"><input type="number" min="0" step="1" placeholder="0" data-f="${f.k}"> 顆</span></label>`).join('');
  $('#pieceFlavor').innerHTML=FLAVORS.map(f=>`<option value="${f.k}">${f.name}</option>`).join('');
  $('#snowFlavor').innerHTML=SNOW.map(s=>`<option value="${s.k}">${s.name}</option>`).join('');
  $('#fDate').value=today();
  autoSplit();updatePrices();
}
const boxSize=()=>+$('#boxSize').value;
const boxMode=()=>$('[name=boxMode]:checked').value;
const readSplit=()=>Object.fromEntries(FLAVORS.map(f=>[f.k,Math.max(0,Math.floor(num($(`[data-f=${f.k}]`).value)))]));

function autoSplit(){
  const size=boxSize(),four=boxMode()==='four';
  $('#chipRow').hidden=four; $('#splitHint').hidden=four;
  const sel=four?FLAVORS.map(f=>f.k):$$('#chipRow input:checked').map(i=>i.value);
  const base=sel.length?Math.floor(size/sel.length):0;
  FLAVORS.forEach(f=>{
    const inp=$(`[data-f=${f.k}]`);
    inp.value=sel.includes(f.k)?base:'';
    inp.readOnly=four;
  });
  updateStatus();
}
function updateStatus(){
  const size=boxSize(),sum=Object.values(readSplit()).reduce((a,b)=>a+b,0);
  const el=$('#splitStatus'),diff=size-sum;
  el.className='status '+(diff===0?'ok':'bad');
  el.textContent=diff===0?`已分配 ${sum} / ${size} 顆，數量正確`
    :diff>0?`已分配 ${sum} / ${size} 顆，還差 ${diff} 顆`:`已分配 ${sum} / ${size} 顆，多了 ${-diff} 顆`;
  $('#addBox').disabled=diff!==0||sum===0;
}
function updatePrices(){
  const size=boxSize(),q=Math.max(1,Math.floor(num($('#boxQty').value)));
  $('#boxPrice').textContent=`每盒 ${money(size*PRICE_BOX_PIECE)}，${q} 盒共 ${money(size*PRICE_BOX_PIECE*q)}`;
  const pq=Math.max(1,Math.floor(num($('#pieceQty').value)));
  $('#piecePrice').textContent=`每顆 ${money(PRICE_BOX_PIECE)}，${pq} 顆共 ${money(PRICE_BOX_PIECE*pq)}`;
  const sq=Math.max(1,Math.floor(num($('#snowQty').value)));
  $('#snowPrice').textContent=`每袋 ${money(PRICE_SNOW_BAG)}，${sq} 袋共 ${money(PRICE_SNOW_BAG*sq)}`;
}
$('#boxSize').onchange=()=>{autoSplit();updatePrices()};
$('#boxQty').oninput=updatePrices;
$('#snowQty').oninput=updatePrices;
$('#pieceQty').oninput=updatePrices;
$$('[name=boxMode]').forEach(r=>r.onchange=autoSplit);
$('#chipRow').onchange=autoSplit;
$('#splitBox').oninput=updateStatus;

function setKind(k){
  $('#kBox').setAttribute('aria-pressed',k==='box');
  $('#kPiece').setAttribute('aria-pressed',k==='piece');
  $('#kSnow').setAttribute('aria-pressed',k==='snow');
  $('#boxPanel').hidden=k!=='box'; $('#piecePanel').hidden=k!=='piece'; $('#snowPanel').hidden=k!=='snow';
}
$('#kBox').onclick=()=>setKind('box');
$('#kPiece').onclick=()=>setKind('piece');
$('#kSnow').onclick=()=>setKind('snow');

$('#addBox').onclick=()=>{
  const qty=Math.floor(num($('#boxQty').value));
  if(qty<1){toast('盒數至少 1');return}
  const size=boxSize();
  draft.push({type:'box',size,mode:boxMode(),split:readSplit(),qty,unit:size*PRICE_BOX_PIECE});
  renderDraft();toast('已加入品項');
};
$('#addPiece').onclick=()=>{
  const qty=Math.floor(num($('#pieceQty').value));
  if(qty<1){toast('顆數至少 1');return}
  draft.push({type:'piece',flavor:$('#pieceFlavor').value,qty,unit:PRICE_BOX_PIECE});
  renderDraft();toast('已加入品項');
};
$('#addSnow').onclick=()=>{
  const qty=Math.floor(num($('#snowQty').value));
  if(qty<1){toast('袋數至少 1');return}
  draft.push({type:'snow',flavor:$('#snowFlavor').value,qty,unit:PRICE_SNOW_BAG});
  renderDraft();toast('已加入品項');
};

function renderDraft(){
  const box=$('#draftItems');
  if(!draft.length){box.innerHTML='<p class="empty">尚未加入品項。</p>';}
  else{
    box.innerHTML='<table><thead><tr><th>品名</th><th class="n">數量</th><th class="n">單價</th><th class="n">總價</th><th></th></tr></thead><tbody>'
      +draft.map((it,i)=>`<tr><td>${esc(itemName(it))}<small>${esc(itemDetail(it))}</small></td><td class="n">${it.qty} ${unitOf(it)}</td><td class="n">${money(it.unit)}</td><td class="n">${money(itemTotal(it))}</td><td class="n"><button class="btn danger sm" type="button" data-rm="${i}" aria-label="移除 ${esc(itemName(it))}">移除</button></td></tr>`).join('')
      +`</tbody><tfoot><tr><td colspan="3">訂單總價</td><td class="n">${money(draft.reduce((s,i)=>s+itemTotal(i),0))}</td><td></td></tr></tfoot></table>`;
  }
  $('#draftMat').innerHTML=matHTML(draft);
}
$('#draftItems').onclick=e=>{
  const b=e.target.closest('[data-rm]'); if(!b)return;
  draft.splice(+b.dataset.rm,1);renderDraft();
};

function resetForm(){
  editingId=null;draft=[];
  ['#fName','#fPhone','#fNote'].forEach(s=>$(s).value='');
  $('#fDate').value=today();
  $('#formTitle').textContent='訂單資料';
  $('#saveOrder').textContent='送出訂單';
  $('#boxQty').value=1;$('#snowQty').value=1;
  autoSplit();updatePrices();renderDraft();
}
$('#resetOrder').onclick=()=>{
  if((draft.length||$('#fName').value)&&!confirm('確定清空目前填寫的內容？'))return;
  resetForm();
};
$('#saveOrder').onclick=()=>{
  const name=$('#fName').value.trim();
  if(!name){toast('請填訂購人');$('#fName').focus();return}
  if(!$('#fDate').value){toast('請選送出日期');$('#fDate').focus();return}
  if(!draft.length){toast('請至少加入一個品項');return}
  const o={id:editingId||uid(),name,phone:$('#fPhone').value.trim(),date:$('#fDate').value,note:$('#fNote').value.trim(),items:JSON.parse(JSON.stringify(draft)),createdAt:Date.now()};
  const i=orders.findIndex(x=>x.id===o.id);
  if(i>=0){o.createdAt=orders[i].createdAt;orders[i]=o}else orders.push(o);
  persist();updateCount();
  const wasEdit=!!editingId;
  resetForm();toast(wasEdit?'訂單已更新':'訂單已送出');
};

/* ================= 訂單紀錄 ================= */
function updateCount(){$('#cnt').textContent=orders.length?`(${orders.length})`:''}
function filtered(){
  const q=$('#q').value.trim().toLowerCase(),f=$('#dFrom').value,t=$('#dTo').value;
  return orders.filter(o=>
    (!q||[o.name,o.phone,o.note].join('\n').toLowerCase().includes(q))&&
    (!f||o.date>=f)&&(!t||o.date<=t)
  ).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
}
function renderList(){
  const list=filtered(),box=$('#orders');
  selected=new Set([...selected].filter(id=>orders.some(o=>o.id===id)));
  if(!orders.length)box.innerHTML='<p class="empty">還沒有訂單。到「新增訂單」建立第一筆。</p>';
  else if(!list.length)box.innerHTML='<p class="empty">沒有符合條件的訂單。</p>';
  else box.innerHTML=list.map(o=>`
    <article class="order ${selected.has(o.id)?'sel':''}">
      <label class="pick"><input type="checkbox" data-pick="${esc(o.id)}" ${selected.has(o.id)?'checked':''} aria-label="選取 ${esc(o.name)} 的訂單"></label>
      <div>
        <div class="o-head"><strong>${esc(o.name)}</strong><span>${esc(o.phone)}</span><span>送出日期 ${esc(o.date)}</span></div>
        <ul class="o-items">${o.items.map(it=>`<li>${esc(itemName(it))} × ${it.qty} ${unitOf(it)}，${money(itemTotal(it))}${itemDetail(it)?`<br><small>${esc(itemDetail(it))}</small>`:''}</li>`).join('')}</ul>
        ${o.note?`<div class="o-note">${esc(o.note)}</div>`:''}
        <details><summary>此單所需材料</summary><div class="mat">${matHTML(o.items)}</div></details>
      </div>
      <div class="o-side">
        <div class="o-total">${money(orderTotal(o))}</div>
        <div><button class="btn ghost sm" type="button" data-edit="${esc(o.id)}">編輯</button> <button class="btn danger sm" type="button" data-del="${esc(o.id)}">刪除</button></div>
      </div>
    </article>`).join('');
  renderSel();
}
function renderSel(){
  const sel=orders.filter(o=>selected.has(o.id));
  if(!sel.length){$('#selInfo').textContent='勾選左邊的訂單，這裡會加總所需材料。';$('#selMat').innerHTML='';return}
  $('#selInfo').textContent=`已選 ${sel.length} 筆訂單，金額合計 ${money(sel.reduce((s,o)=>s+orderTotal(o),0))}`;
  $('#selMat').innerHTML=matHTML(sel.flatMap(o=>o.items));
}
$('#orders').onchange=e=>{
  const c=e.target.closest('[data-pick]'); if(!c)return;
  c.checked?selected.add(c.dataset.pick):selected.delete(c.dataset.pick);
  c.closest('.order').classList.toggle('sel',c.checked);
  renderSel();
};
$('#orders').onclick=e=>{
  const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');
  if(ed){
    const o=orders.find(x=>x.id===ed.dataset.edit); if(!o)return;
    editingId=o.id;draft=JSON.parse(JSON.stringify(o.items));
    $('#fName').value=o.name;$('#fPhone').value=o.phone;$('#fDate').value=o.date;$('#fNote').value=o.note;
    $('#formTitle').textContent='編輯訂單';$('#saveOrder').textContent='更新訂單';
    renderDraft();showTab('new');
  }
  if(del){
    const o=orders.find(x=>x.id===del.dataset.del); if(!o)return;
    if(!confirm(`確定刪除「${o.name}」的訂單？此動作無法復原。`))return;
    orders=orders.filter(x=>x.id!==o.id);selected.delete(o.id);
    persist();updateCount();renderList();toast('已刪除');
  }
};
['#q','#dFrom','#dTo'].forEach(s=>$(s).oninput=renderList);
$('#fClear').onclick=()=>{$('#q').value='';$('#dFrom').value='';$('#dTo').value='';renderList()};
$('#selAll').onclick=()=>{filtered().forEach(o=>selected.add(o.id));renderList()};
$('#selNone').onclick=()=>{selected.clear();renderList()};

/* ================= 備份 / 匯出 ================= */
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#expJson').onclick=()=>{
  download(`orders-${today()}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),orders},null,2),'application/json');
  toast('已匯出備份');
};
$('#impJson').onclick=()=>$('#impFile').click();
$('#impFile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    const arr=(Array.isArray(d)?d:d.orders);
    if(!Array.isArray(arr))throw 0;
    const inc=arr.map(normOrder).filter(o=>o&&o.items.length);
    let n=0;
    for(const o of inc){const i=orders.findIndex(x=>x.id===o.id);i>=0?orders[i]=o:orders.push(o);n++}
    persist();updateCount();renderList();toast(`已匯入 ${n} 筆訂單`);
  }catch{toast('匯入失敗：檔案格式不正確')}
};
$('#expCsv').onclick=()=>{
  const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`};
  const rows=[['送出日期','訂購人','電話','品名','內容','數量','單位','單價','總價','備註']];
  for(const o of filtered())for(const it of o.items)
    rows.push([o.date,o.name,o.phone,itemName(it),itemDetail(it),it.qty,unitOf(it),it.unit,itemTotal(it),o.note]);
  download(`orders-${today()}.csv`,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
};

/* ================= 啟動 ================= */
initBuilder();renderDraft();updateCount();
</script>
</body>
</html>
